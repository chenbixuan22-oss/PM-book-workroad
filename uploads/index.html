<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品需求手账</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CSS 变量
   ============================================================ */
:root {
  --color-primary: #8B7355;
  --color-primary-light: #A89279;
  --color-primary-dark: #6B563F;
  --color-secondary: #5B7B8F;
  --color-ai: #4A7FB5;
  --color-ai-light: #E8F1FA;
  --color-ai-bg: #F0F6FC;

  --bg-shelf: linear-gradient(180deg, #2D2118 0%, #4A3728 50%, #5D4A38 100%);
  --bg-page: #F4EDE4;
  --bg-paper: #FEFCF8;
  --bg-paper-warm: #FAF5ED;

  --text-primary: #2C241E;
  --text-secondary: #6B5D50;
  --text-tertiary: #9C8E7E;
  --text-muted: #B8ADA0;
  --text-inverse: #FEFCF8;

  --color-success: #5B8C5A;
  --color-warning: #C4913C;
  --color-error: #C0564F;
  --color-info: #5B7B8F;

  --shadow-sm: 0 1px 3px rgba(60,40,20,0.08);
  --shadow-md: 0 4px 12px rgba(60,40,20,0.1);
  --shadow-lg: 0 8px 24px rgba(60,40,20,0.12);
  --shadow-book: 2px 4px 16px rgba(60,40,20,0.15), 0 1px 3px rgba(60,40,20,0.1);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  --font-serif: 'Noto Serif SC', 'Songti SC', Georgia, serif;
  --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --sidebar-width: 220px;
  --topbar-height: 56px;
}

/* ============================================================
   Reset & Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font-sans);
  color: var(--text-primary);
  background: var(--bg-page);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea { font-family: inherit; border: none; outline: none; }
ul, ol { list-style: none; }

/* ============================================================
   Typography
   ============================================================ */
h1, h2, h3 { font-family: var(--font-serif); font-weight: 600; color: var(--text-primary); }
h1 { font-size: 1.75rem; line-height: 1.4; }
h2 { font-size: 1.35rem; line-height: 1.4; }
h3 { font-size: 1.1rem; line-height: 1.4; }

/* ============================================================
   Utility Classes
   ============================================================ */
.text-secondary { color: var(--text-secondary); }
.text-tertiary  { color: var(--text-tertiary); }
.text-serif     { font-family: var(--font-serif); }
.text-mono      { font-family: var(--font-mono); }

/* ============================================================
   Buttons
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--radius-sm);
  font-size: 0.9rem; font-weight: 500;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.btn-primary {
  background: var(--color-primary); color: var(--text-inverse);
  box-shadow: 0 1px 3px rgba(60,40,20,0.15);
}
.btn-primary:hover { background: var(--color-primary-dark); transform: translateY(-1px); }
.btn-secondary {
  background: transparent; color: var(--color-primary);
  border: 1px solid var(--color-primary-light);
}
.btn-secondary:hover { background: rgba(139,115,85,0.08); }
.btn-ghost {
  color: var(--text-secondary); padding: 6px 12px;
}
.btn-ghost:hover { color: var(--text-primary); background: rgba(0,0,0,0.04); border-radius: var(--radius-sm); }
.btn-sm { padding: 5px 12px; font-size: 0.8rem; }

/* ============================================================
   Cards
   ============================================================ */
.card {
  background: var(--bg-paper);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  padding: 20px;
}

/* Paper texture — subtle repeating gradient to mimic paper grain */
.paper-texture {
  background-color: var(--bg-paper);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(200,185,165,0.03) 2px, rgba(200,185,165,0.03) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(200,185,165,0.02) 2px, rgba(200,185,165,0.02) 4px);
}

/* ============================================================
   Tags / Badges
   ============================================================ */
.tag {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 6px;
  font-size: 0.75rem; font-weight: 500;
}
.tag-success { background: rgba(91,140,90,0.12); color: var(--color-success); }
.tag-warning { background: rgba(196,145,60,0.12); color: var(--color-warning); }
.tag-error   { background: rgba(192,86,79,0.12); color: var(--color-error); }
.tag-info    { background: rgba(91,123,143,0.12); color: var(--color-info); }
.tag-ai      { background: var(--color-ai-light); color: var(--color-ai); }
.tag-muted   { background: rgba(0,0,0,0.05); color: var(--text-tertiary); }

/* ============================================================
   Page Transition
   ============================================================ */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.page-enter { animation: fadeIn 0.25s ease-out; }

/* ============================================================
   Locked Chapter Styles
   ============================================================ */
.locked-chapter {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 50vh; text-align: center; padding: 48px 24px;
}
.locked-icon {
  font-size: 4rem; margin-bottom: 16px; opacity: 0.4;
  filter: grayscale(0.6);
}
.locked-title {
  font-family: var(--font-serif); font-size: 1.5rem; color: var(--text-secondary);
  margin-bottom: 8px;
}
.locked-desc {
  color: var(--text-tertiary); font-size: 0.9rem; max-width: 400px; margin-bottom: 28px;
}
.locked-progress-wrap {
  width: 100%; max-width: 320px; margin-bottom: 20px;
}
.locked-progress-label {
  font-size: 0.8rem; color: var(--text-tertiary); margin-bottom: 6px;
}
.locked-progress-bar-bg {
  height: 10px; background: rgba(0,0,0,0.06); border-radius: 5px; overflow: hidden;
}
.locked-progress-bar-fill {
  height: 100%; background: var(--color-primary); border-radius: 5px;
  transition: width 0.5s ease;
}
.locked-progress-value {
  font-size: 0.85rem; font-family: var(--font-mono); color: var(--color-primary);
  font-weight: 600; margin-top: 6px;
}
.locked-hint {
  font-size: 0.82rem; color: var(--text-muted); max-width: 360px;
  margin-bottom: 24px; line-height: 1.6;
}

/* ============================================================
   Stamp / Celebration Animation
   ============================================================ */
#stamp-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(44, 36, 30, 0.6);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.3s ease;
  backdrop-filter: blur(4px);
}
#stamp-overlay.stamp-visible { opacity: 1; }
.stamp-container {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}
.stamp-badge {
  width: 140px; height: 140px;
  border: 4px solid var(--color-primary);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-paper);
  box-shadow: 0 0 0 8px rgba(139,115,85,0.15), var(--shadow-lg);
  animation: stampDrop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  transform: scale(2) rotate(-15deg); opacity: 0;
}
@keyframes stampDrop {
  0% { transform: scale(2) rotate(-15deg); opacity: 0; }
  60% { transform: scale(0.9) rotate(2deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.stamp-inner {
  text-align: center;
}
.stamp-text-top {
  font-family: var(--font-serif); font-size: 0.8rem;
  color: var(--color-primary); font-weight: 600; letter-spacing: 2px;
}
.stamp-check {
  font-size: 2.5rem; color: var(--color-success); font-weight: 700;
  line-height: 1.2;
}
.stamp-text-bottom {
  font-family: var(--font-serif); font-size: 0.9rem;
  color: var(--color-primary); font-weight: 700;
}
.stamp-congrats {
  font-size: 1rem; color: var(--text-inverse); font-weight: 500;
  animation: fadeIn 0.4s 0.3s ease-out both;
}
.stamp-btn {
  animation: fadeIn 0.4s 0.5s ease-out both;
}

/* ============================================================
   Field-filled flash animation
   ============================================================ */
.req-fields-list {
  display: flex; flex-direction: column; gap: 2px;
  flex: 1; overflow-y: auto;
}
.req-field-row {
  padding: 8px 10px; border-radius: var(--radius-sm);
  transition: background 0.3s ease;
}
.req-field-row:hover { background: rgba(139,115,85,0.04); }
.req-field-row.field-filled {
  animation: fieldFlash 0.6s ease-out;
}
.req-field-header {
  display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
}
.req-field-dot { font-size: 0.6rem; line-height: 1; }
.req-field-num {
  width: 18px; height: 18px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.62rem; font-family: var(--font-mono); font-weight: 600;
  flex-shrink: 0;
}
.req-field-num.num-done { background: rgba(91,140,90,0.14); color: var(--color-success); }
.req-field-num.num-partial { background: rgba(196,145,60,0.14); color: var(--color-warning); }
.req-field-num.num-missing { background: rgba(0,0,0,0.05); color: var(--text-muted); }
.req-field-label {
  font-size: 0.78rem; font-weight: 500; color: var(--text-tertiary);
}
.req-field-value {
  font-size: 0.85rem; color: var(--text-primary); line-height: 1.5;
  padding-left: 18px;
  min-height: 22px;
  border-radius: 4px;
  outline: none;
}
.req-field-value:focus {
  background: rgba(74,127,181,0.08);
  box-shadow: 0 0 0 1px rgba(74,127,181,0.18);
}
.req-field-value:empty::before {
  content: attr(data-placeholder);
  color: var(--text-muted);
  font-style: italic;
}
@keyframes fieldFlash {
  0% { background: rgba(139,115,85,0.12); }
  100% { background: transparent; }
}
.field-empty .req-field-value {
  font-size: 0.82rem;
}
.status-dot.preview { background: var(--color-info); box-shadow: 0 0 0 3px rgba(91,123,143,0.16); }
.preview-notice {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; margin-bottom: 18px;
  background: var(--color-ai-bg);
  border: 1px solid rgba(74,127,181,0.16);
  border-left: 3px solid var(--color-ai);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 0.84rem; line-height: 1.6;
}
.preview-notice strong { color: var(--color-ai); }

/* ============================================================
   Scrollbar
   ============================================================ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

/* ============================================================
   Layout: App Shell
   ============================================================ */
#app { min-height: 100vh; }

/* ------ Global Top Bar (书架首页) ------ */
.topbar {
  height: var(--topbar-height);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  background: var(--bg-paper);
  border-bottom: 1px solid rgba(139,115,85,0.12);
  position: sticky; top: 0; z-index: 100;
}
.topbar-logo {
  font-family: var(--font-serif); font-size: 1.2rem; font-weight: 700;
  color: var(--color-primary-dark);
  display: flex; align-items: center; gap: 8px;
}
.topbar-logo::before {
  content: '📒'; font-size: 1.3rem;
}
.topbar-actions { display: flex; align-items: center; gap: 12px; }
.topbar-search {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-page); border-radius: var(--radius-sm);
  padding: 6px 14px; width: 240px;
  border: 1px solid transparent;
  transition: border-color 0.2s;
}
.topbar-search:focus-within { border-color: var(--color-primary-light); }
.topbar-search input {
  background: transparent; flex: 1; font-size: 0.85rem;
  color: var(--text-primary);
}
.topbar-search input::placeholder { color: var(--text-muted); }

/* ------ Notebook Top Bar (需求内页) ------ */
.nb-topbar {
  height: var(--topbar-height);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  background: var(--bg-paper);
  border-bottom: 1px solid rgba(139,115,85,0.12);
  position: sticky; top: 0; z-index: 100;
}
.nb-topbar-left { display: flex; align-items: center; gap: 12px; }
.nb-topbar-left .back-btn {
  display: flex; align-items: center; gap: 4px;
  color: var(--text-secondary); font-size: 0.85rem;
  padding: 4px 8px; border-radius: var(--radius-sm);
  transition: all 0.15s;
}
.nb-topbar-left .back-btn:hover { color: var(--text-primary); background: rgba(0,0,0,0.04); }
.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-tertiary); }
.breadcrumb span { color: var(--text-muted); }
.nb-topbar-center {
  font-family: var(--font-serif); font-weight: 600; font-size: 1.05rem;
  color: var(--text-primary);
}
.nb-topbar-right { display: flex; align-items: center; gap: 8px; }

/* ------ Notebook Body Layout ------ */
.nb-layout {
  display: flex; min-height: calc(100vh - var(--topbar-height));
}

/* ------ Sidebar ------ */
.nb-sidebar {
  width: var(--sidebar-width);
  background: var(--bg-paper-warm);
  border-right: 1px solid rgba(139,115,85,0.1);
  padding: 20px 0;
  flex-shrink: 0;
  position: sticky; top: var(--topbar-height);
  height: calc(100vh - var(--topbar-height));
  overflow-y: auto;
  transition: width 0.25s ease, padding 0.25s ease;
  display: flex; flex-direction: column;
}
.nb-sidebar .nb-sidebar-nav { flex: 1; }
.nb-sidebar .sidebar-collapse-btn {
  margin: 12px 16px; padding: 6px 12px;
  font-size: 0.78rem; color: var(--text-tertiary);
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; border-radius: var(--radius-sm);
  transition: all 0.15s; background: none; border: none; font-family: inherit;
}
.nb-sidebar .sidebar-collapse-btn:hover { background: rgba(139,115,85,0.08); color: var(--text-secondary); }

/* Collapsed sidebar: thin strip with expand button */
.nb-sidebar.collapsed {
  width: 36px; padding: 12px 0; overflow: hidden; align-items: center;
}
.nb-sidebar.collapsed .nb-sidebar-title,
.nb-sidebar.collapsed .nb-sidebar-nav,
.nb-sidebar.collapsed .sidebar-collapse-btn { display: none; }
.nb-sidebar .sidebar-expand-btn {
  display: none; width: 28px; height: 28px; border-radius: var(--radius-sm);
  align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-tertiary); font-size: 0.8rem;
  transition: all 0.15s; background: none; border: none; margin-top: 8px;
}
.nb-sidebar .sidebar-expand-btn:hover { background: rgba(139,115,85,0.1); color: var(--text-primary); }
.nb-sidebar.collapsed .sidebar-expand-btn { display: flex; }

/* --- Panel toggle buttons (clarify page) --- */
.panel-toggle {
  position: absolute; top: 12px; z-index: 10;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg-paper); border: 1px solid rgba(139,115,85,0.2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 0.7rem; color: var(--text-secondary);
  transition: all 0.15s; box-shadow: var(--shadow-sm);
}
.panel-toggle:hover {
  background: var(--color-primary); color: var(--text-inverse); border-color: var(--color-primary);
}

.clarify-left .panel-toggle { right: -12px; }
.clarify-left.collapsed .panel-toggle { right: -28px; }

.clarify-right .panel-toggle { left: -12px; }
.clarify-right.collapsed .panel-toggle { left: -28px; }
.nb-sidebar-title {
  font-family: var(--font-serif); font-size: 0.8rem; font-weight: 600;
  color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 1px;
  padding: 0 20px; margin-bottom: 12px;
}
.nb-sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nb-sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px; font-size: 0.88rem;
  color: var(--text-secondary);
  transition: all 0.15s; cursor: pointer;
  position: relative;
  border-left: 3px solid transparent;
}
.nb-sidebar-item:hover {
  background: rgba(139,115,85,0.06);
  color: var(--text-primary);
}
.nb-sidebar-item.active {
  background: rgba(139,115,85,0.1);
  color: var(--color-primary-dark);
  border-left-color: var(--color-primary);
  font-weight: 500;
}
.nb-sidebar-item .icon { font-size: 1rem; flex-shrink: 0; }
.nb-sidebar-item .label { flex: 1; }
.nb-sidebar-item .status-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.status-dot.done    { background: var(--color-success); }
.status-dot.current { background: var(--color-warning); box-shadow: 0 0 0 3px rgba(196,145,60,0.2); }
.status-dot.pending { background: var(--text-muted); }

/* ------ Notebook Main Content ------ */
.nb-main {
  flex: 1; padding: 28px 32px;
  min-width: 0;
  background: var(--bg-page);
}

/* ============================================================
   Shelf Page — Book Cards
   ============================================================ */
.shelf-layout {
  display: flex; gap: 24px;
  padding: 20px 28px;
  min-height: calc(100vh - var(--topbar-height) - 48px);
}
.shelf-main { flex: 1; min-width: 0; }
.shelf-aside {
  width: 260px; flex-shrink: 0;
}

/* Filter tabs */
.filter-bar {
  display: flex; align-items: center; gap: 16px; padding: 14px 28px;
  background: var(--bg-paper-warm);
  border-bottom: 1px solid rgba(139,115,85,0.08);
}
.filter-date { font-family: var(--font-serif); font-size: 0.85rem; font-weight: 500; color: var(--text-tertiary); white-space: nowrap; flex-shrink: 0; margin-left: auto; }
.filter-period { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.filter-period select { padding: 6px 12px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; color: var(--color-primary-dark); background: var(--bg-paper); border: 1px solid rgba(139,115,85,0.2); cursor: pointer; font-family: var(--font-serif); }
.filter-period select:focus { border-color: var(--color-primary); outline: none; }
.filter-divider { width: 1px; height: 20px; background: rgba(139,115,85,0.15); flex-shrink: 0; }
.filter-tabs { display: flex; gap: 6px; flex: 1; }
.filter-tab {
  padding: 5px 14px; border-radius: var(--radius-sm);
  font-size: 0.85rem; color: var(--text-secondary);
  transition: all 0.15s; cursor: pointer;
}
.filter-tab:hover { background: rgba(139,115,85,0.08); color: var(--text-primary); }
.filter-tab.active {
  background: var(--color-primary); color: var(--text-inverse);
}

/* Book card grid */
.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 240px));
  gap: 16px;
}
.book-card {
  background: var(--bg-paper);
  max-width: 240px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-book);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  display: flex; flex-direction: column;
  aspect-ratio: 3 / 4;
  position: relative;
}
.book-card:hover {
  transform: translateY(-6px);
  box-shadow: 4px 8px 28px rgba(60,40,20,0.2), 0 2px 6px rgba(60,40,20,0.12);
}
/* Left spine decoration */
.book-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
  border-radius: var(--radius-md) 0 0 var(--radius-md);
}
.book-card[data-color="brown"]::before  { background: var(--color-primary); }
.book-card[data-color="blue"]::before   { background: var(--color-secondary); }
.book-card[data-color="green"]::before  { background: var(--color-success); }
.book-card[data-color="orange"]::before { background: var(--color-warning); }
.book-card[data-color="red"]::before    { background: var(--color-error); }
.book-card[data-color="teal"]::before   { background: #5B8F8F; }
.book-card-body {
  flex: 1; padding: 18px 18px 18px 22px;
  display: flex; flex-direction: column;
}
.book-card-title {
  font-family: var(--font-serif); font-size: 1rem; font-weight: 600;
  margin-bottom: 10px; line-height: 1.4;
}
.book-card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: auto; }
.book-card-progress { margin-top: 14px; }
.book-card-progress-bar {
  height: 4px; background: rgba(0,0,0,0.06); border-radius: 4px; overflow: hidden;
}
.book-card-progress-fill {
  height: 100%; border-radius: 4px;
  background: var(--color-primary);
  transition: width 0.6s ease;
}
.book-card-progress-text {
  font-size: 0.75rem; color: var(--text-tertiary); margin-top: 4px;
  display: flex; justify-content: space-between;
}
.book-card-footer {
  padding: 10px 18px 10px 22px;
  border-top: 1px solid rgba(0,0,0,0.05);
  font-size: 0.75rem; color: var(--text-tertiary);
  display: flex; justify-content: space-between; align-items: center;
}
.book-card-risk {
  font-size: 0.75rem; padding: 2px 6px;
  border-radius: 3px; margin-top: 8px;
}

/* Shelf aside - weekly overview */
.aside-card {
  background: var(--bg-paper); border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm); padding: 18px;
  margin-bottom: 16px;
}
.aside-card h3 {
  font-size: 0.95rem; margin-bottom: 14px;
  padding-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.06);
}
.stat-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; font-size: 0.88rem; color: var(--text-secondary);
}

/* PM Profile Card */
.pm-profile { display: flex; align-items: center; gap: 12px; }
.pm-avatar-wrap { position: relative; flex-shrink: 0; }
.pm-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--bg-page); border: 2px solid rgba(139,115,85,0.15); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; overflow: hidden; }
.pm-avatar img { width: 100%; height: 100%; object-fit: cover; }
.pm-info { flex: 1; min-width: 0; }
.pm-name { font-family: var(--font-serif); font-size: 0.92rem; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-bio { font-size: 0.78rem; color: var(--text-tertiary); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pm-edit-form { width: 100%; text-align: left; }
.pm-edit-form label { font-size: 0.78rem; color: var(--text-tertiary); font-weight: 500; margin-bottom: 3px; display: block; }
.pm-edit-form input, .pm-edit-form textarea { width: 100%; padding: 7px 10px; background: var(--bg-page); border: 1px solid rgba(139,115,85,0.15); border-radius: var(--radius-sm); font-size: 0.85rem; color: var(--text-primary); margin-bottom: 10px; font-family: inherit; resize: none; }
.pm-edit-form input:focus, .pm-edit-form textarea:focus { border-color: var(--color-primary); outline: none; }
.stat-row .stat-value {
  font-family: var(--font-mono); font-weight: 600; font-size: 1.1rem;
  color: var(--text-primary);
}

/* Weekly Treasure Map */
.treasure-map { position: relative; padding: 4px 0 0 0; }
.treasure-map::before {
  content: ''; position: absolute; left: 17px; top: 28px; bottom: 30px; width: 2px;
  background: repeating-linear-gradient(180deg, var(--color-primary-light) 0px, var(--color-primary-light) 4px, transparent 4px, transparent 8px);
  opacity: 0.5;
}
.tm-node { display: flex; align-items: flex-start; gap: 12px; position: relative; padding: 6px 0; }
.tm-icon {
  width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0; position: relative; z-index: 1;
  border: 2px solid; background: var(--bg-paper);
}
.tm-node.done .tm-icon { border-color: var(--color-success); background: rgba(91,140,90,0.1); }
.tm-node.active .tm-icon { border-color: var(--color-warning); background: rgba(196,145,60,0.1); box-shadow: 0 0 0 3px rgba(196,145,60,0.15); }
.tm-node.todo .tm-icon { border-color: var(--text-muted); background: var(--bg-page); opacity: 0.6; }
.tm-body { flex: 1; padding-top: 4px; }
.tm-title { font-size: 0.82rem; font-weight: 500; color: var(--text-primary); line-height: 1.4; }
.tm-node.todo .tm-title { color: var(--text-muted); }
.tm-detail { font-size: 0.72rem; color: var(--text-tertiary); margin-top: 2px; }
.tm-node.done .tm-detail { color: var(--color-success); }
.tm-node.active .tm-detail { color: var(--color-warning); }
.tm-treasure {
  margin-top: 10px; padding: 10px 12px; background: rgba(196,145,60,0.06); border-radius: var(--radius-sm);
  border: 1px dashed rgba(196,145,60,0.25); font-size: 0.78rem; color: var(--text-secondary); line-height: 1.5;
  font-style: italic;
}
.tm-treasure::before { content: '🗺️ '; }

/* ============================================================
   Modal
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(44,36,30,0.5);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--bg-paper); border-radius: var(--radius-lg);
  box-shadow: 0 20px 60px rgba(44,36,30,0.25);
  width: 560px; max-height: 85vh; overflow-y: auto;
  transform: translateY(20px);
  transition: transform 0.25s ease;
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal-header {
  padding: 22px 24px 0; display: flex; justify-content: space-between; align-items: center;
}
.modal-header h2 { font-size: 1.2rem; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; color: var(--text-tertiary);
  transition: background 0.15s;
}
.modal-close:hover { background: rgba(0,0,0,0.06); }
.modal-body { padding: 20px 24px; }
.modal-footer {
  padding: 16px 24px; display: flex; justify-content: flex-end; gap: 10px;
  border-top: 1px solid rgba(0,0,0,0.06);
}

/* ============================================================
   Placeholder for pages not yet filled
   ============================================================ */
.page-placeholder {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 400px; text-align: center;
  color: var(--text-tertiary);
}
.page-placeholder .ph-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
.page-placeholder h2 { color: var(--text-secondary); margin-bottom: 8px; }
.page-placeholder p { font-size: 0.9rem; }

/* ============================================================
   AI Clarify Page
   ============================================================ */
.clarify-layout { display: flex; gap: 0; height: calc(100vh - var(--topbar-height)); margin: -28px -32px; }
.clarify-center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.clarify-right { width: 360px; padding: 20px; border-left: 1px solid rgba(139,115,85,0.1); overflow-y: auto; flex-shrink: 0; background: var(--bg-paper); display: flex; flex-direction: column; }

/* Clarify Tabs */
.clarify-tabs { display: flex; gap: 2px; background: var(--bg-page); padding: 3px; border-radius: var(--radius-sm); margin-bottom: 18px; }
.clarify-tab { flex: 1; padding: 7px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; text-align: center; transition: all 0.15s; background: none; border: none; font-family: inherit; }
.clarify-tab:hover { color: var(--text-primary); }
.clarify-tab.active { background: var(--bg-paper); color: var(--color-primary-dark); box-shadow: var(--shadow-sm); }

.clarify-left h3 { font-size: 0.9rem; margin-bottom: 12px; }
.original-req { padding: 12px; background: rgba(139,115,85,0.06); border-left: 3px solid var(--color-primary); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 0.88rem; line-height: 1.6; color: var(--text-secondary); margin-bottom: 16px; font-style: italic; }
.gap-list { display: flex; flex-direction: column; gap: 8px; }
.gap-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; padding: 6px 8px; border-radius: var(--radius-sm); }
.gap-item.done { color: var(--color-success); background: rgba(91,140,90,0.06); }
.gap-item.partial { color: var(--color-warning); background: rgba(196,145,60,0.06); }
.gap-item.missing { color: var(--color-error); background: rgba(192,86,79,0.06); }

.chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; background: var(--bg-page); }
.chat-header { padding: 12px 20px; border-bottom: 1px solid rgba(139,115,85,0.08); background: var(--bg-paper); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.chat-input-bar { padding: 12px 20px; border-top: 1px solid rgba(139,115,85,0.08); background: var(--bg-paper); display: flex; gap: 8px; align-items: center; }
.chat-input-bar input { flex: 1; padding: 10px 14px; background: var(--bg-page); border-radius: var(--radius-sm); font-size: 0.88rem; color: var(--text-primary); border: 1px solid rgba(139,115,85,0.12); transition: border-color 0.2s; }
.chat-input-bar input:focus { border-color: var(--color-primary); outline: none; }
.chat-input-bar input:disabled { color: var(--text-muted); cursor: not-allowed; }
.chat-input-bar input::placeholder { color: var(--text-muted); }
.chat-send-btn { padding: 10px 18px; background: var(--color-primary); color: var(--text-inverse); border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
.chat-send-btn:hover { background: var(--color-primary-dark); }
.chat-send-btn:disabled { background: var(--text-muted); cursor: not-allowed; }
.chat-no-key { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-muted); flex: 1; }
.chat-no-key a { color: var(--color-primary); cursor: pointer; text-decoration: underline; }

/* AI typing indicator */
.msg-loading .msg-bubble::after { content: ''; display: inline-block; width: 4px; height: 14px; background: var(--color-primary); margin-left: 2px; border-radius: 1px; animation: blink-caret 0.7s step-end infinite; vertical-align: text-bottom; }
@keyframes blink-caret { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* Error message bubble */
.msg-error .msg-bubble { background: rgba(192,86,79,0.08); color: var(--color-error); border: 1px solid rgba(192,86,79,0.15); border-bottom-left-radius: 2px; }
.msg-error .msg-avatar { background: rgba(192,86,79,0.1); }

.msg { display: flex; gap: 10px; max-width: 85%; }
.msg-ai { align-self: flex-start; }
.msg-user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; }
.msg-ai .msg-avatar { background: var(--color-ai-light); }
.msg-user .msg-avatar { background: rgba(139,115,85,0.1); }
.msg-bubble { padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.88rem; line-height: 1.6; }
.msg-ai .msg-bubble { background: var(--color-ai-bg); color: var(--text-primary); border-bottom-left-radius: 2px; }
.msg-user .msg-bubble { background: var(--bg-paper-warm); color: var(--text-primary); border-bottom-right-radius: 2px; border: 1px solid rgba(139,115,85,0.1); }

.req-card-section { margin-bottom: 16px; }
.req-card-section .section-label { font-size: 0.75rem; color: var(--text-tertiary); font-weight: 500; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
.req-card-section .section-value { font-size: 0.88rem; line-height: 1.6; color: var(--text-primary); }
.req-card-section .ai-badge { font-size: 0.65rem; padding: 1px 6px; background: var(--color-ai-light); color: var(--color-ai); border-radius: 3px; }
.req-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.req-tags .tag { font-size: 0.78rem; }
.risk-item { display: flex; align-items: flex-start; gap: 6px; font-size: 0.85rem; color: var(--text-secondary); padding: 4px 0; }

/* ============================================================
   Overview Page
   ============================================================ */
.overview-header { margin-bottom: 32px; }
.overview-meta { display: flex; gap: 24px; margin-top: 12px; font-size: 0.88rem; color: var(--text-secondary); flex-wrap: wrap; }
.overview-meta span { display: flex; align-items: center; gap: 4px; }

.lifecycle { display: flex; align-items: flex-start; gap: 0; margin: 32px 0; padding: 24px 16px; background: var(--bg-paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.lc-step { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; cursor: pointer; width: 90px; }
.lc-dot { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; border: 2px solid var(--text-muted); color: var(--text-muted); background: var(--bg-paper); position: relative; z-index: 2; transition: all 0.2s; }
.lc-step.completed .lc-dot { background: var(--color-success); border-color: var(--color-success); color: white; }
.lc-step.active .lc-dot { background: var(--color-warning); border-color: var(--color-warning); color: white; box-shadow: 0 0 0 4px rgba(196,145,60,0.2); }
.lc-label { font-size: 0.78rem; color: var(--text-tertiary); text-align: center; font-weight: 500; }
.lc-step.completed .lc-label { color: var(--color-success); }
.lc-step.active .lc-label { color: var(--color-warning); font-weight: 600; }
.lc-line { flex: 1; height: 2px; background: var(--text-muted); min-width: 12px; margin-top: 17px; opacity: 0.3; }
.lc-line.done { background: var(--color-success); opacity: 1; }

.chapter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.chapter-card { background: var(--bg-paper); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: 20px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; display: flex; flex-direction: column; }
.chapter-card:hover { border-color: var(--color-primary-light); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.chapter-card .ch-icon { font-size: 1.5rem; margin-bottom: 10px; }
.chapter-card .ch-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
.chapter-card .ch-desc { font-size: 0.82rem; color: var(--text-tertiary); line-height: 1.5; margin-bottom: 12px; flex: 1; }
.chapter-card .ch-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
.chapter-card .ch-link { font-size: 0.82rem; color: var(--color-primary); font-weight: 500; }
.chapter-card:hover .ch-link { text-decoration: underline; }

/* ============================================================
   Prototype Page
   ============================================================ */
.proto-layout { display: flex; gap: 0; margin: -28px -32px; height: calc(100vh - var(--topbar-height)); }
.proto-sidebar { width: 240px; padding: 20px; border-right: 1px solid rgba(139,115,85,0.1); overflow-y: auto; flex-shrink: 0; background: var(--bg-paper-warm); }
.proto-main { flex: 1; padding: 28px 32px; overflow-y: auto; }
.proto-sidebar h3 { font-size: 0.9rem; margin-bottom: 16px; }
.proto-list { display: flex; flex-direction: column; gap: 4px; }
.proto-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.88rem; color: var(--text-secondary); transition: all 0.15s; border-left: 3px solid transparent; }
.proto-item:hover { background: rgba(139,115,85,0.06); color: var(--text-primary); }
.proto-item.active { background: rgba(139,115,85,0.1); color: var(--color-primary-dark); border-left-color: var(--color-primary); font-weight: 500; }
.proto-item .num { width: 22px; height: 22px; border-radius: 50%; background: rgba(139,115,85,0.1); display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 600; color: var(--text-tertiary); flex-shrink: 0; }
.proto-item.active .num { background: var(--color-primary); color: white; }

.wireframe-phone { width: 240px; height: 440px; border: 3px solid #ccc; border-radius: 28px; padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; background: #f8f8f8; margin: 0 auto; box-shadow: var(--shadow-md); }
.wf-statusbar { height: 14px; background: #e0e0e0; border-radius: 3px; }
.wf-navbar { height: 36px; background: #e8e4de; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #888; font-weight: 500; }
.wf-banner { height: 90px; background: linear-gradient(135deg, #d4c4a8 0%, #b8a080 100%); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.wf-banner-title { font-size: 0.78rem; color: #5a4a38; font-weight: 600; }
.wf-banner-btn { padding: 3px 12px; background: #8B7355; color: white; border-radius: 10px; font-size: 0.6rem; }
.wf-cards { display: flex; gap: 6px; flex: 1; }
.wf-card-item { flex: 1; background: #e8e4de; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: #aaa; }
.wf-tabbar { height: 36px; background: #e8e4de; border-radius: 4px; display: flex; gap: 2px; }
.wf-tabbar div { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; color: #bbb; }

.module-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.module-table th, .module-table td { padding: 10px 14px; text-align: left; font-size: 0.85rem; border-bottom: 1px solid rgba(139,115,85,0.08); }
.module-table th { font-weight: 500; color: var(--text-tertiary); font-size: 0.78rem; background: var(--bg-paper-warm); }
.interaction-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.interaction-item { display: flex; align-items: flex-start; gap: 10px; font-size: 0.85rem; color: var(--text-secondary); padding: 8px 12px; background: var(--bg-paper-warm); border-radius: var(--radius-sm); }
.interaction-item .num-badge { width: 20px; height: 20px; border-radius: 50%; background: var(--color-primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0; font-weight: 600; }

/* ============================================================
   Logic Page
   ============================================================ */
.logic-tabs { display: flex; gap: 4px; background: var(--bg-paper-warm); padding: 3px; border-radius: var(--radius-sm); margin-bottom: 24px; width: fit-content; }
.logic-tab { padding: 8px 20px; border-radius: var(--radius-sm); font-size: 0.88rem; color: var(--text-secondary); cursor: pointer; transition: all 0.15s; font-weight: 500; }
.logic-tab:hover { color: var(--text-primary); }
.logic-tab.active { background: var(--color-primary); color: var(--text-inverse); }

.flow-container { padding: 32px; background: var(--bg-paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); min-height: 300px; }
.flow-row { display: flex; align-items: center; justify-content: center; gap: 0; flex-wrap: wrap; }
.flow-node { padding: 12px 20px; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 500; text-align: center; min-width: 100px; border: 2px solid; }
.flow-node-start { background: rgba(91,140,90,0.1); border-color: var(--color-success); color: var(--color-success); border-radius: 20px; }
.flow-node-normal { background: var(--bg-paper); border-color: var(--color-primary-light); color: var(--text-primary); }
.flow-node-decision { background: rgba(196,145,60,0.08); border-color: var(--color-warning); color: var(--color-warning); transform: rotate(0deg); border-radius: 4px; font-weight: 600; }
.flow-node-end { background: rgba(91,123,143,0.1); border-color: var(--color-info); color: var(--color-info); border-radius: 20px; }
.flow-node-error { background: rgba(192,86,79,0.08); border-color: var(--color-error); color: var(--color-error); }
.flow-arrow { color: var(--text-muted); font-size: 1.2rem; padding: 0 8px; flex-shrink: 0; }
.flow-arrow-down { display: flex; justify-content: center; padding: 8px 0; color: var(--text-muted); font-size: 1.2rem; }
.flow-branch { display: flex; gap: 40px; justify-content: center; margin-top: 8px; }
.flow-branch-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.flow-branch-label { font-size: 0.75rem; color: var(--text-tertiary); font-weight: 500; padding: 2px 8px; background: var(--bg-paper-warm); border-radius: 10px; }

/* ============================================================
   PRD Page
   ============================================================ */
.prd-layout { display: flex; gap: 0; margin: -28px -32px; height: calc(100vh - var(--topbar-height)); }
.prd-toc { width: 200px; padding: 20px; border-right: 1px solid rgba(139,115,85,0.1); overflow-y: auto; flex-shrink: 0; background: var(--bg-paper-warm); }
.prd-content { flex: 1; padding: 32px 40px; overflow-y: auto; background: var(--bg-paper); }
.prd-aside { width: 280px; padding: 20px; border-left: 1px solid rgba(139,115,85,0.1); overflow-y: auto; flex-shrink: 0; background: var(--bg-paper-warm); }

.prd-toc h3 { font-size: 0.85rem; margin-bottom: 14px; color: var(--text-tertiary); }
.toc-list { display: flex; flex-direction: column; gap: 2px; }
.toc-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 0.82rem; color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-sm); transition: all 0.15s; }
.toc-item:hover { background: rgba(139,115,85,0.06); color: var(--text-primary); }
.toc-item.active { color: var(--color-primary-dark); font-weight: 500; background: rgba(139,115,85,0.1); }
.toc-item .toc-num { font-size: 0.7rem; color: var(--text-muted); min-width: 16px; }

.prd-doc-title { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
.prd-doc-meta { display: flex; gap: 8px; margin-bottom: 32px; }
.prd-section { margin-bottom: 28px; }
.prd-section h3 { font-family: var(--font-serif); font-size: 1.1rem; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(139,115,85,0.1); color: var(--color-primary-dark); }
.prd-section p { font-size: 0.9rem; line-height: 1.8; color: var(--text-secondary); }
.prd-section ul { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.prd-section ul li { font-size: 0.88rem; color: var(--text-secondary); display: flex; align-items: flex-start; gap: 8px; line-height: 1.6; }

<body>
<div id="app"></div>

<!-- ============================================================

<script>
/* ============================================================
   AI Service Layer
   ============================================================ */
const PROVIDER_CONFIG = {
  openai:    { baseUrl: 'https://api.openai.com/v1', defaultModel: 'gpt-4.1', format: 'openai',
               models: ['gpt-4.1', 'gpt-4.1-mini', 'gpt-5', 'gpt-5-mini', 'o3'] },
  anthropic: { baseUrl: 'https://api.anthropic.com/v1', defaultModel: 'claude-sonnet-4-6', format: 'anthropic',
               models: ['claude-sonnet-4-6', 'claude-haiku-4-5', 'claude-opus-4-7', 'claude-opus-4-6', 'claude-sonnet-4-5'] },
  deepseek:  { baseUrl: 'https://api.deepseek.com', defaultModel: 'deepseek-v4-flash', format: 'openai',
               models: ['deepseek-v4-flash', 'deepseek-v4-pro'] },
  custom:    { baseUrl: '', defaultModel: '', format: 'openai', models: [] },
};

function getAIConfig() {
  const provider = localStorage.getItem('ai_provider') || 'anthropic';
  const apiKey = localStorage.getItem('ai_api_key') || '';
  const model = localStorage.getItem('ai_model') || '';
  const baseUrl = localStorage.getItem('ai_base_url') || '';
  const conf = PROVIDER_CONFIG[provider] || PROVIDER_CONFIG.openai;
  return {
    provider,
    apiKey,
    model: model || conf.defaultModel,
    baseUrl: (provider === 'custom' && baseUrl) ? baseUrl.replace(/\/+$/, '') : conf.baseUrl,
    format: conf.format,
    hasKey: !!apiKey,
  };
}

async function callAI(messages, { onChunk, onDone, onError }) {
  const config = getAIConfig();
  if (!config.hasKey) { onError('未配置 API Key，请先在设置中填写'); return; }

  const controller = new AbortController();
  let fullText = '';

  try {
    let url, headers, body;

    if (config.format === 'anthropic') {
      url = config.baseUrl + '/messages';
      headers = {
        'Content-Type': 'application/json',
        'x-api-key': config.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      };
      const sysMsg = messages.find(m => m.role === 'system');
      const chatMsgs = messages.filter(m => m.role !== 'system');
      body = JSON.stringify({
        model: config.model,
        max_tokens: 2048,
        stream: true,
        system: sysMsg ? sysMsg.content : '',
        messages: chatMsgs.map(m => ({ role: m.role, content: m.content })),
      });
    } else {
      url = config.baseUrl + '/chat/completions';
      headers = {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + config.apiKey,
      };
      body = JSON.stringify({
        model: config.model,
        messages: messages.map(m => ({ role: m.role, content: m.content })),
        stream: true,
      });
    }

    const resp = await fetch(url, { method: 'POST', headers, body, signal: controller.signal });

    if (!resp.ok) {
      const errText = await resp.text().catch(() => '');
      let errMsg = `API 请求失败 (${resp.status})`;
      if (resp.status === 401) errMsg = 'API Key 无效，请在设置中检查';
      else if (resp.status === 429) errMsg = '请求过于频繁，请稍后再试';
      else if (resp.status === 0 || errText.includes('CORS') || errText.includes('Failed to fetch'))
        errMsg = '跨域请求被拦截，请在设置中使用「自定义」模式填写支持跨域的中转地址';
      try { const j = JSON.parse(errText); if (j.error?.message) errMsg += '：' + j.error.message; } catch(e) {}
      onError(errMsg);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data:')) continue;
        const data = trimmed.slice(5).trim();
        if (data === '[DONE]') continue;

        try {
          const json = JSON.parse(data);
          let token = '';
          if (config.format === 'anthropic') {
            if (json.type === 'content_block_delta' && json.delta?.text) token = json.delta.text;
          } else {
            token = json.choices?.[0]?.delta?.content || '';
          }
          if (token) {
            fullText += token;
            onChunk(token, fullText);
          }
        } catch (e) { /* skip malformed SSE line */ }
      }
    }
    onDone(fullText);
  } catch (err) {
    if (err.name === 'AbortError') return;
    let msg = '网络请求失败';
    if (err.message?.includes('Failed to fetch') || err.message?.includes('NetworkError'))
      msg = '无法连接到 AI 服务。如果使用 OpenAI/Anthropic 官方地址，浏览器可能存在跨域限制，请在设置中使用「自定义」模式填写支持跨域的中转地址';
    onError(msg);
  }
  return controller;
}

function cloneJSON(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function createEmptyDimensions() {
  return CLARITY_DIMENSIONS.reduce((acc, dim) => {
    acc[dim] = { status: 'missing', value: '' };
    return acc;
  }, {});
}

function loadClarifyMessages() {
  try {
    const raw = localStorage.getItem(CLARIFY_STORAGE_KEYS.messages);
    if (!raw) return cloneJSON(MOCK_CHAT_MESSAGES);
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) && parsed.length ? parsed : cloneJSON(MOCK_CHAT_MESSAGES);
  } catch(e) {
    return cloneJSON(MOCK_CHAT_MESSAGES);
  }
}

function loadClarifyState() {
  try {
    const raw = localStorage.getItem(CLARIFY_STORAGE_KEYS.state);
    if (!raw) return cloneJSON(DEFAULT_CLARIFY_STATE);
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : cloneJSON(DEFAULT_CLARIFY_STATE);
  } catch(e) {
    return cloneJSON(DEFAULT_CLARIFY_STATE);
  }
}

function loadDemoTurn() {
  const val = parseInt(localStorage.getItem(CLARIFY_STORAGE_KEYS.demoTurn) || '0', 10);
  return Number.isFinite(val) && val >= 0 ? val : 0;
}

function saveClarifyState() {
  localStorage.setItem(CLARIFY_STORAGE_KEYS.state, JSON.stringify(clarifyState));
}

function saveClarifyMessages() {
  localStorage.setItem(CLARIFY_STORAGE_KEYS.messages, JSON.stringify(clarifyMessages));
}

function saveDemoTurn() {
  localStorage.setItem(CLARIFY_STORAGE_KEYS.demoTurn, String(demoTurn));
}

function normalizeClarifyState(state) {
  if (!state.originalRequirement) state.originalRequirement = DEFAULT_ORIGINAL_REQUIREMENT;
  state.dimensions = { ...createEmptyDimensions(), ...(state.dimensions || {}) };
  CLARITY_DIMENSIONS.forEach(dim => {
    const current = state.dimensions[dim] || {};
    state.dimensions[dim] = {
      status: ['done','partial','missing'].includes(current.status) ? current.status : 'missing',
      value: current.value || '',
    };
  });
  state.card = { ...cloneJSON(DEFAULT_CLARIFY_STATE.card), ...(state.card || {}) };
  CARD_FIELD_KEYS.forEach(key => {
    if (typeof state.card[key] !== 'string') state.card[key] = '';
  });
  state.stampShown = !!state.stampShown;
}

function calculateClarifyCompleteness(dimensions = clarifyState.dimensions) {
  const score = CLARITY_DIMENSIONS.reduce((sum, dim) => {
    const status = dimensions[dim]?.status || 'missing';
    if (status === 'done') return sum + 1;
    if (status === 'partial') return sum + 0.5;
    return sum;
  }, 0);
  return Math.round((score / CLARITY_DIMENSIONS.length) * 100);
}

function recomputeClarifyCompletion(opts = {}) {
  const { persist = true, triggerStamp = false } = opts;
  const wasComplete = !!clarifyState.isComplete;
  clarifyState.completeness = calculateClarifyCompleteness();
  clarifyState.isComplete = clarifyState.completeness >= 80;
  if (triggerStamp && !wasComplete && clarifyState.isComplete && !clarifyState.stampShown) {
    clarifyState.stampShown = true;
    if (persist) saveClarifyState();
    triggerStampAnimation();
  } else if (persist) {
    saveClarifyState();
  }
}

// 从 AI 回复中解析 JSON 状态块
function parseAIStateBlock(text) {
  const jsonMatch = text.match(/```json\s*([\s\S]*?)\s*```/);
  if (!jsonMatch) return null;
  try {
    return JSON.parse(jsonMatch[1]);
  } catch(e) {
    return null;
  }
}

// 从 AI 回复中移除 JSON 块（不展示给用户）
function stripStateBlock(text) {
  return text
    .replace(/\s*```json\s*[\s\S]*?\s*```\s*$/, '')
    .replace(/\s*```json\s*[\s\S]*$/, '')
    .trim();
}

// 更新 UI：需求卡片字段 + 进度条
function updateClarifyUI(newState) {
  // 合并状态
  if (newState?.dimensions) {
    CLARITY_DIMENSIONS.forEach(dim => {
      const next = newState.dimensions[dim];
      if (!next) return;
      clarifyState.dimensions[dim] = {
        status: ['done','partial','missing'].includes(next.status) ? next.status : 'missing',
        value: next.value || '',
      };
    });
  }
  if (newState?.card) {
    Object.keys(newState.card).forEach(k => {
      if (newState.card[k]) clarifyState.card[k] = newState.card[k];
    });
  }
  normalizeClarifyState(clarifyState);
  recomputeClarifyCompletion({ persist: true, triggerStamp: true });
  refreshClarifyProgressUI();

  // 更新需求卡片字段（统一面板）
  const cardContainer = document.getElementById('req-card-dynamic');
  if (cardContainer) cardContainer.innerHTML = renderRequirementFields();

  // 更新侧边栏状态
  updateSidebarStatus();
}

function refreshClarifyProgressUI() {
  const progressBar = document.getElementById('clarify-progress-bar');
  const progressText = document.getElementById('clarify-progress-text');
  if (progressBar) {
    progressBar.style.width = clarifyState.completeness + '%';
    progressBar.style.background = clarifyState.completeness >= 80 ? 'var(--color-success)' : 'var(--color-primary)';
  }
  if (progressText) progressText.textContent = clarifyState.completeness + '%';

  const action = document.getElementById('clarify-next-action');
  if (action) {
    action.innerHTML = clarifyState.isComplete 
      ? `<button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="navigate('/notebook/overview')">进入需求总览 →</button>`
      : `<button class="btn btn-secondary" style="width:100%;justify-content:center;opacity:0.6;cursor:not-allowed;" disabled>完成度 ≥ 80% 后解锁下一步</button>`;
  }
}

function escapeHTML(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderRequirementFields() {
  return CARD_FIELD_KEYS.map((key, idx) => renderRequirementField(key, idx)).join('');
}

function renderRequirementField(key, idx) {
  const val = clarifyState.card[key] || '';
  const filled = val.trim().length > 0;
  const dimKey = FIELD_DIMENSION_MAP[key];
  const dimStatus = dimKey && clarifyState.dimensions[dimKey] ? clarifyState.dimensions[dimKey].status : (filled ? 'done' : 'missing');
  const numCls = dimStatus === 'done' ? 'num-done' : dimStatus === 'partial' ? 'num-partial' : 'num-missing';
  return `<div class="req-field-row ${filled ? 'field-filled' : 'field-empty'}" data-field-row="${key}">
    <div class="req-field-header">
      <span class="req-field-num ${numCls}" data-field-num="${key}">${idx + 1}</span>
      <span class="req-field-label">${key}</span>
    </div>
    <div class="req-field-value-wrap">
      <div class="req-field-value" contenteditable="true" data-field="${key}" data-placeholder="点击填写${key}..." oninput="onFieldEdit(this, '${key}')" onblur="onFieldBlur(this, '${key}')">${escapeHTML(val)}</div>
    </div>
  </div>`;
}

function inferDimensionStatusFromValue(value) {
  const text = (value || '').trim();
  if (!text) return 'missing';
  return text.length >= 8 ? 'done' : 'partial';
}

function syncDimensionFromField(key) {
  const dim = FIELD_DIMENSION_MAP[key];
  if (!dim) return;
  const value = (clarifyState.card[key] || '').trim();
  clarifyState.dimensions[dim] = {
    status: inferDimensionStatusFromValue(value),
    value,
  };
}

function updateFieldRowVisual(key) {
  const row = document.querySelector(`[data-field-row="${key}"]`);
  const num = document.querySelector(`[data-field-num="${key}"]`);
  if (!row || !num) return;
  const filled = (clarifyState.card[key] || '').trim().length > 0;
  const dim = FIELD_DIMENSION_MAP[key];
  const status = dim ? clarifyState.dimensions[dim]?.status : (filled ? 'done' : 'missing');
  row.classList.toggle('field-filled', filled);
  row.classList.toggle('field-empty', !filled);
  num.className = 'req-field-num ' + (status === 'done' ? 'num-done' : status === 'partial' ? 'num-partial' : 'num-missing');
}

function onFieldEdit(el, key) {
  clarifyState.card[key] = (el.textContent || '').trim();
  syncDimensionFromField(key);
  recomputeClarifyCompletion({ persist: true, triggerStamp: true });
  updateFieldRowVisual(key);
  refreshClarifyProgressUI();
  updateSidebarStatus();
}

function onFieldBlur(el, key) {
  clarifyState.card[key] = (el.textContent || '').trim();
  syncDimensionFromField(key);
  recomputeClarifyCompletion({ persist: true, triggerStamp: true });
  updateFieldRowVisual(key);
  refreshClarifyProgressUI();
  updateSidebarStatus();
}

// 更新侧边栏导航状态

    .replace(/\n/g, '<br>');

function runDemoClarifyReply(userText, aiDiv, countEl) {
  const reply = getDemoClarifyReply(userText);
  setTimeout(() => {
    if (aiDiv) {
      aiDiv.classList.remove('msg-loading');
      updateMessageBubble(aiDiv, reply.text);
    }
    clarifyMessages.push({ role: 'assistant', content: reply.text });
    saveClarifyMessages();
    if (countEl) countEl.textContent = `共 ${clarifyMessages.length} 条对话`;
    updateClarifyUI(reply.state);
    isAIResponding = false;
    setChatInputState(false);
    const inp = document.getElementById('clarify-input');
    if (inp) inp.focus();
  }, 450);
}

async function sendClarifyMessage() {
  const input = document.getElementById('clarify-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text || isAIResponding) return;

  // 追加用户消息
  input.value = '';
  clarifyMessages.push({ role: 'user', content: text });
  saveClarifyMessages();
  appendMessage('user', text);

  // 更新对话计数
  const countEl = document.getElementById('clarify-msg-count');
  if (countEl) countEl.textContent = `共 ${clarifyMessages.length} 条对话`;

  // 开始 AI 响应
  isAIResponding = true;
  setChatInputState(true);
  const aiDiv = appendMessage('assistant', '', { loading: true });

  const aiConfig = getAIConfig();
  if (!aiConfig.hasKey) {
    runDemoClarifyReply(text, aiDiv, countEl);
    return;
  }

  const messages = [
    { role: 'system', content: CLARIFY_SYSTEM_PROMPT },
    ...clarifyMessages,
  ];

  await callAI(messages, {
    onChunk(token, fullText) {
      if (aiDiv) {
        aiDiv.classList.remove('msg-loading');
        // 不展示 JSON 块给用户
        updateMessageBubble(aiDiv, stripStateBlock(fullText));
      }
    },
    onDone(fullText) {
      if (aiDiv) aiDiv.classList.remove('msg-loading');
      // 解析状态块并更新 UI
      const stateBlock = parseAIStateBlock(fullText);
      const displayText = stripStateBlock(fullText);
      updateMessageBubble(aiDiv, displayText);
      clarifyMessages.push({ role: 'assistant', content: fullText });
      saveClarifyMessages();
      if (countEl) countEl.textContent = `共 ${clarifyMessages.length} 条对话`;
      isAIResponding = false;
      setChatInputState(false);
      const inp = document.getElementById('clarify-input');
      if (inp) inp.focus();
      // 更新联动 UI
      if (stateBlock) updateClarifyUI(stateBlock);
    },
    onError(errMsg) {
      if (aiDiv) aiDiv.remove();
      appendMessage('assistant', errMsg, { error: true });
      isAIResponding = false;
      setChatInputState(false);
    },
  });
}

  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    alert('请选择图片文件');
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    alert('图片大小不能超过 2MB');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    const dataURL = e.target.result;
    document.getElementById('pm-edit-avatar').value = dataURL;
    const preview = document.getElementById('pm-avatar-preview');
    if (preview) {
      preview.innerHTML = `<img src="${dataURL}" alt="preview" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
      preview.style.borderStyle = 'solid';
    }
  };
  reader.readAsDataURL(file);
}

function applyFilter(filterLabel) {
  currentFilter = filterLabel;
  document.querySelectorAll('.filter-bar .filter-tab').forEach(t => {
    t.classList.toggle('active', t.textContent === filterLabel);

  refreshBookGrid();
}

  currentYear = sel.value;

}

  ];

  const chaptersHTML = chapters.map(ch => `
    <div class="chapter-card" onclick="navigate('${ch.route}')">
      <div class="ch-icon">${ch.icon}</div>
      <div class="ch-title">${ch.title}</div>

      </div>
    </div>`).join('');

/* Recalculate row on input change */
function recalcRow(idx) {
  const targets = [8, 70, 90, 75, 10];
  const input = document.getElementById('actual-' + idx);
  const val = parseFloat(input.value) || 0;
  const target = targets[idx];
  const rate = target > 0 ? ((val / target) * 100).toFixed(1) : '0.0';
  document.getElementById('rate-' + idx).textContent = rate + '%';

  let status, cls;
  const r = parseFloat(rate);
  if (r >= 110) { status = '✅ 超预期'; cls = 'tag-success'; }
  else if (r >= 95) { status = '✅ 达标'; cls = 'tag-success'; }
  else if (r >= 85) { status = '⚠️ 低于预期'; cls = 'tag-warning'; }
  else { status = '🔴 不达预期'; cls = 'tag-error'; }

  const el = document.getElementById('status-' + idx);
  el.textContent = status;
  el.className = 'tag ' + cls;
}

function onProviderChange() {
  const provider = document.getElementById('setting-provider').value;
  const conf = PROVIDER_CONFIG[provider] || {};
  const models = conf.models || [];

  // 更新描述
  const descs = { openai: 'GPT-4.1 / GPT-5 系列', anthropic: 'Claude Sonnet 4.6 / Haiku 4.5 系列', deepseek: 'DeepSeek V4 Flash / Pro 系列', custom: '兼容 OpenAI 格式的自定义服务' };
  const descEl = document.getElementById('provider-desc');
  if (descEl) descEl.textContent = descs[provider] || '';

  // 更新 Base URL placeholder
  const baseUrlInput = document.getElementById('setting-base-url');
  if (baseUrlInput) {
    const placeholders = { openai: 'https://api.openai.com/v1', anthropic: 'https://api.anthropic.com/v1', deepseek: 'https://api.deepseek.com', custom: 'https://your-proxy.example.com/v1' };
    baseUrlInput.placeholder = (placeholders[provider] || 'https://api.example.com/v1') + ' （留空用默认）';
  }

  // 刷新模型标签
  const modelTagsList = document.getElementById('model-tags-list');
  const modelInput = document.getElementById('setting-model');
  if (modelTagsList) {
    if (models.length === 0) {
      modelTagsList.innerHTML = '<span style="font-size:0.82rem;color:var(--text-muted);">请在下方手动输入模型名</span>';
      modelInput.value = '';
    } else {
      const defaultModel = conf.defaultModel || models[0];
      modelTagsList.innerHTML = models.map(m =>
        `<button class="model-tag ${m === defaultModel ? 'active' : ''}" onclick="selectModel(this, '${m}')">${m}</button>`
      ).join('');
      modelInput.value = defaultModel;
    }
  }

  // 清空测试结果
  const result = document.getElementById('test-connection-result');
  if (result) result.innerHTML = '';
}

function toggleKeyVisibility() {
  const input = document.getElementById('setting-api-key');
  const btn = document.getElementById('btn-toggle-key');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

function selectModel(btn, modelName) {
  document.querySelectorAll('.model-tag').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('setting-model').value = modelName;
}

async function testAIConnection() {
  const btn = document.getElementById('btn-test-connection');
  const result = document.getElementById('test-connection-result');
  const apiKey = document.getElementById('setting-api-key').value.trim();
  const provider = document.getElementById('setting-provider').value;
  const baseUrl = document.getElementById('setting-base-url').value.trim();
  const model = document.getElementById('setting-model').value.trim();

  if (!apiKey) {
    result.innerHTML = '<span style="color:var(--color-error);">❌ 请先填写 API Key</span>';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ 测试中…';
  result.innerHTML = '';

  try {
    const conf = PROVIDER_CONFIG[provider] || PROVIDER_CONFIG.openai;
    const url = (baseUrl || conf.baseUrl).replace(/\/+$/, '');
    const testModel = model || conf.defaultModel;

    let fetchUrl, headers, body;

    if (conf.format === 'anthropic') {
      fetchUrl = url + '/messages';
      headers = {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      };
      body = JSON.stringify({ model: testModel, max_tokens: 10, messages: [{ role: 'user', content: 'Hi' }] });
    } else {
      fetchUrl = url + '/chat/completions';
      headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey };
      body = JSON.stringify({ model: testModel, max_tokens: 10, messages: [{ role: 'user', content: 'Hi' }] });
    }

    const resp = await fetch(fetchUrl, { method: 'POST', headers, body });

    if (resp.ok) {
      result.innerHTML = '<span style="color:var(--color-success);">✅ 连接成功！配置有效</span>';
    } else if (resp.status === 401) {
      result.innerHTML = '<span style="color:var(--color-error);">❌ API Key 无效</span>';
    } else if (resp.status === 403) {
      result.innerHTML = '<span style="color:var(--color-error);">❌ 权限不足，请检查 Key 权限</span>';
    } else if (resp.status === 404) {
      result.innerHTML = '<span style="color:var(--color-error);">❌ 接口地址错误或模型不存在</span>';
    } else {
      const errData = await resp.json().catch(() => ({}));
      result.innerHTML = `<span style="color:var(--color-error);">❌ 请求失败 (${resp.status}): ${errData.error?.message || '未知错误'}</span>`;
    }
  } catch (e) {
    if (e.name === 'TypeError' && e.message.includes('Failed to fetch')) {
      result.innerHTML = '<span style="color:var(--color-error);">❌ 网络错误或跨域限制，建议填写支持跨域的 Base URL</span>';
    } else {
      result.innerHTML = `<span style="color:var(--color-error);">❌ ${e.message}</span>`;
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '🔗 连接测试';
  }
}

function toggleSwitch(label) {
  const sw = label.querySelector('.toggle-switch');
  sw.classList.toggle('on');
}

function saveSettings() {
  const provider = document.getElementById('setting-provider').value;
  const apiKey = document.getElementById('setting-api-key').value.trim();
  const model = document.getElementById('setting-model').value.trim();
  const baseUrl = document.getElementById('setting-base-url') ? document.getElementById('setting-base-url').value.trim() : '';
  const autoSave = document.querySelector('.toggle-switch').classList.contains('on');
  const lang = document.getElementById('setting-lang').value;

  localStorage.setItem('ai_provider', provider);
  localStorage.setItem('ai_api_key', apiKey);
  localStorage.setItem('ai_model', model);
  localStorage.setItem('ai_base_url', baseUrl);
  localStorage.setItem('ai_auto_save', autoSave);
  localStorage.setItem('ai_lang', lang);

  // 简单的保存成功反馈
  const btn = event.target;
  const origText = btn.textContent;
  btn.textContent = '✅ 已保存';
  btn.disabled = true;
  setTimeout(() => { btn.textContent = origText; btn.disabled = false; }, 1500);
}

function resetSettings() {
  if (!confirm('确定要清除所有 AI 配置吗？')) return;
  ['ai_provider','ai_api_key','ai_model','ai_base_url','ai_auto_save','ai_lang'].forEach(k => localStorage.removeItem(k));
  renderSettings();
}
</script>
